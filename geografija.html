<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zanimljiva geografija</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--ac:#2f6fed;--acx:#fff;--ok:#1f9d55;--warn:#d98a00;--bd:#e2dfd7}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--card:#222428;--tx:#f0f0f2;--mut:#9a9aa2;--ac:#6b9bff;--acx:#10131a;--ok:#4cc783;--warn:#f0b43c;--bd:#33363c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}
p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.code{font-size:26px;letter-spacing:.35em;text-align:center;text-transform:uppercase}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:0;background:var(--ac);color:var(--acx);width:100%;cursor:pointer;margin-top:10px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.45}
.err{color:#d6453d;min-height:1.3em;font-size:14px;margin-top:6px}
.big{font-size:44px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--ac)}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.pl:last-child{border:0}
.me{font-weight:700}
.small{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.letter{font-size:56px;font-weight:800;color:var(--ac);line-height:1}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px}
td b{display:block;font-size:14px}
.p20{color:var(--ok)}.p5{color:var(--warn)}.p0{color:var(--mut)}
.z{font-weight:800;font-size:15px}
.win{text-align:center;font-size:22px;font-weight:800;color:var(--ok)}
details summary{cursor:pointer;font-weight:600}
.vr{align-items:center;gap:8px}
.vbs{display:flex;gap:8px;flex:none}
.vb{width:auto;margin:0;padding:8px 16px;font-size:18px;color:#fff}
.vb.yes{background:var(--ok)}.vb.no{background:#d6453d}
.vb:not(.on){opacity:.3}.vb.on:disabled{opacity:1}
.rej{text-decoration:line-through}
</style>
</head>
<body>
<main id="app"><p class="sub">Učitavanje…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDWpgn7qQjSrk9WaI0UhGQyaTv2SCCh5kc",
  authDomain: "sifra-62129.firebaseapp.com",
  databaseURL: "https://sifra-62129-default-rtdb.firebaseio.com",
  projectId: "sifra-62129",
  appId: "1:800751511664:web:e53e0eb6e392922a456cb5"
};
const CATS = ['Država','Grad','Biljka','Životinja','Predmet','Ime'];
const POOL = 'ABCDEFGHIJKLMNOPRSTUVZ'.split('');
const ROUNDS = 8, DUR = 120000, VOTE_DUR = 60000;
const $app = document.getElementById('app');
const LS = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let pid = LS.get('geo-pid');
if (!pid) { pid = 'g' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); LS.set('geo-pid', pid); }
let myName = LS.get('geo-name') || LS.get('sifra-name'), code = null, game = null, ref = null, msg = '', fdb, offset = 0;
let draft = ['','','','','',''], draftKey = '', subKey = '', endKey = '', vdraft = {}, vkey = '', subVKey = '', endVKey = '';
const now = () => Date.now() + offset;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const setMsg = t => { msg = t; const el = document.getElementById('err'); if (el) el.textContent = t; };
const mkCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for (let i=0;i<4;i++) c += a[Math.floor(Math.random()*a.length)]; return c; };
const CY = {'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s'};
const norm = s => String(s||'').toLowerCase().replace(/[а-џ]/g, c => CY[c] || c).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'dj').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

/* ---------- bodovanje (računa se na svakom uređaju iz sačuvanih odgovora) ---------- */
function roundScore(g, r){
  const L = norm(g.letters[r-1]), ans = (g.answers && g.answers['r'+r]) || {}, vt = (g.votes && g.votes['r'+r]) || {}, out = {};
  g.players.forEach(p => out[p.id] = { cells: [], sum: 0, bonus: 0 });
  for (let c=0;c<6;c++){
    const v = {}, rej = {}; let n = 0;
    g.players.forEach(p => {
      const a = norm((ans[p.id]||[])[c]); let ok = a.length >= 2 && a[0] === L;
      if (ok) { let yes = 0, no = 0; g.players.forEach(q => { if (q.id !== p.id) { if ((vt[q.id]||{})[p.id+'_'+c] === 0) no++; else yes++; } }); if (no > yes) { ok = false; rej[p.id] = true; } }
      v[p.id] = ok ? a : null; if (ok) n++;
    });
    g.players.forEach(p => {
      const a = v[p.id]; let pts = 0;
      if (a) { const same = g.players.filter(q => v[q.id] === a).length; pts = n === 1 ? 20 : (same > 1 ? 5 : 10); }
      out[p.id].cells.push({ a: (ans[p.id]||[])[c] || '', pts, rej: !!rej[p.id] });
    });
  }
  g.players.forEach(p => { const o = out[p.id]; o.sum = o.cells.reduce((t,x) => t + x.pts, 0); if (o.cells.every(x => x.pts === 10)) { o.bonus = 10; o.sum += 10; } });
  return out;
}
function totals(g){
  const t = {}; g.players.forEach(p => t[p.id] = 0);
  const last = (g.status === 'review' || g.status === 'done') ? g.round : (g.round || 1) - 1;
  for (let r=1;r<=last;r++){ const s = roundScore(g, r); g.players.forEach(p => t[p.id] += s[p.id].sum); }
  return t;
}

/* ---------- Firebase ---------- */
function boot(){
  try { firebase.initializeApp(firebaseConfig); fdb = firebase.database(); fdb.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0); }
  catch(e){ $app.innerHTML = '<div class="card"><p class="sub">Greška pri povezivanju sa Firebase-om.</p></div>'; return; }
  setInterval(tick, 250);
  document.addEventListener('input', e => { const i = e.target.dataset && e.target.dataset.i; if (i !== undefined) draft[+i] = e.target.value; });
  const saved = LS.get('geo-code'); if (saved) watch(saved); else render();
}
function watch(c){
  if (ref) ref.off();
  code = c; LS.set('geo-code', c); ref = fdb.ref('games/geo' + c);
  ref.on('value', snap => {
    const v = snap.val();
    if (!v) { leave(); msg = 'Igra ' + c + ' ne postoji.'; render(); return; }
    v.players = v.players || []; v.letters = v.letters || []; v.answers = v.answers || {}; v.votes = v.votes || {};
    game = v;
    if (v.status === 'playing' && v.players.every(p => (v.answers['r'+v.round] || {})[p.id])) endRound();
    if (v.status === 'voting' && v.players.every(p => (v.votes['r'+v.round] || {})[p.id])) endVoting();
    render();
  }, () => { msg = 'Veza sa igrom je prekinuta.'; render(); });
}
function leave(){ if (ref) { ref.off(); ref = null; } code = null; game = null; LS.set('geo-code',''); }
function pick(cur){ const used = cur.letters || []; const av = POOL.filter(x => !used.includes(x)); return av[Math.floor(Math.random()*av.length)]; }
function openRound(cur){ cur.round = (cur.round||0) + 1; cur.letters = (cur.letters||[]).concat([pick(cur)]); cur.status = 'playing'; cur.endsAt = now() + DUR; return cur; }

async function createGame(){
  const name = val('name').trim(); if (!name) return setMsg('Upiši svoje ime.');
  myName = name; LS.set('geo-name', name);
  try { const c = mkCode(); await fdb.ref('games/geo' + c).set({ code: c, kind: 'geo', hostId: pid, status: 'lobby', players: [{ id: pid, name }], round: 0, created: Date.now() }); msg = ''; watch(c); }
  catch(e){ setMsg('Nije moguće napraviti igru. Proveri Firebase pravila.'); }
}
async function joinGame(){
  const name = val('name').trim(), c = val('jcode').trim().toUpperCase();
  if (!name) return setMsg('Upiši svoje ime.'); if (c.length !== 4) return setMsg('Kod igre ima 4 slova.');
  myName = name; LS.set('geo-name', name);
  try {
    const g = fdb.ref('games/geo' + c);
    if (!(await g.once('value')).exists()) return setMsg('Igra sa tim kodom ne postoji.');
    let err = '';
    await g.transaction(cur => {
      if (cur === null) return cur;
      const pl = cur.players || [];
      if (pl.some(p => p.id === pid)) return;
      if (cur.status !== 'lobby') { err = 'Igra je već počela.'; return; }
      if (pl.length >= 4) { err = 'Igra je popunjena (najviše 4 igrača).'; return; }
      pl.push({ id: pid, name }); cur.players = pl; return cur;
    });
    if (err) return setMsg(err);
    msg = ''; watch(c);
  } catch(e){ setMsg('Pridruživanje nije uspelo.'); }
}
function startGame(){ ref.transaction(cur => { if (!cur || cur.status !== 'lobby' || cur.hostId !== pid || (cur.players||[]).length < 2) return; return openRound(cur); }); }
function nextRound(){
  const r = game.round;
  ref.transaction(cur => { if (!cur || cur.status !== 'review' || cur.round !== r) return; if (r >= ROUNDS) { cur.status = 'done'; return cur; } return openRound(cur); });
}
function endRound(){
  const k = code + game.round; if (endKey === k) return; endKey = k; const r = game.round;
  ref.transaction(cur => { if (!cur || cur.status !== 'playing' || cur.round !== r) return; cur.status = 'voting'; cur.voteEnds = now() + VOTE_DUR; return cur; });
}
function endVoting(){
  const k = code + game.round; if (endVKey === k) return; endVKey = k; const r = game.round;
  ref.transaction(cur => { if (!cur || cur.status !== 'voting' || cur.round !== r) return; cur.status = 'review'; return cur; });
}
function myVotes(){
  const r = game.round, Ln = norm(game.letters[r-1]), ans = game.answers['r'+r] || {}, o = {};
  game.players.forEach(p => { if (p.id === pid) return; for (let c=0;c<6;c++){ const a = norm((ans[p.id]||[])[c]); if (a.length >= 2 && a[0] === Ln) { const k = p.id + '_' + c; o[k] = vdraft[k] === 0 ? 0 : 1; } } });
  return Object.keys(o).length ? o : { none: 1 };
}
function submitVotes(){
  if (!game || game.status !== 'voting') return; const r = game.round, k = code + r; if (subVKey === k) return; subVKey = k; const o = myVotes();
  ref.transaction(cur => { if (!cur || cur.status !== 'voting' || cur.round !== r) return; cur.votes = cur.votes || {}; cur.votes['r'+r] = cur.votes['r'+r] || {}; cur.votes['r'+r][pid] = o; return cur; });
  render();
}
function submit(){
  if (!game || game.status !== 'playing') return; const r = game.round, k = code + r; if (subKey === k) return; subKey = k;
  const arr = draft.map(x => String(x).trim());
  ref.transaction(cur => {
    if (!cur || cur.status !== 'playing' || cur.round !== r) return;
    cur.answers = cur.answers || {}; cur.answers['r'+r] = cur.answers['r'+r] || {}; cur.answers['r'+r][pid] = arr; return cur;
  });
  render();
}
function tick(){
  if (game && game.status === 'voting') {
    const rem = game.voteEnds - now(), el = document.getElementById('vtimer');
    if (el) { const s = Math.max(0, Math.ceil(rem/1000)); el.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); el.style.color = s <= 10 ? '#d6453d' : ''; }
    if (rem <= 0) submitVotes();
    if (rem <= -3500) endVoting();
    return;
  }
  if (!game || game.status !== 'playing') return;
  const rem = game.endsAt - now(), el = document.getElementById('timer');
  if (el) { const s = Math.max(0, Math.ceil(rem/1000)); el.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); el.style.color = s <= 15 ? '#d6453d' : ''; }
  if (rem <= 0) submit();
  if (rem <= -3500) endRound();
}
const newGame = () => { leave(); msg = ''; render(); };
const copyCode = () => { try { navigator.clipboard.writeText(code); setMsg('Kod je kopiran.'); } catch(e){} };

/* ---------- prikaz ---------- */
function render(){
  const act = document.activeElement, ai = act && act.dataset ? act.dataset.i : undefined, keep = {};
  ['name','jcode'].forEach(i => { const el = document.getElementById(i); if (el) keep[i] = el.value; });
  let h = '<h1>Zanimljiva geografija</h1><p class="sub">Igra za 2–4 igrača · 8 rundi</p>';
  if (!game) h += home(keep); else if (game.status === 'lobby') h += lobby(); else if (game.status === 'playing') h += playing();
  else if (game.status === 'voting') h += voting(); else if (game.status === 'review') h += review(); else h += done();
  if (game && game.status !== 'done') h += '<button class="sec" data-a="leave">Napusti igru</button>';
  h += '<div class="err" id="err">' + esc(msg) + '</div>';
  $app.innerHTML = h;
  ['name','jcode'].forEach(i => { const el = document.getElementById(i); if (el && keep[i] !== undefined) el.value = keep[i]; });
  if (ai !== undefined) { const el = document.querySelector('[data-i="' + ai + '"]'); if (el) el.focus(); }
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => ({create:createGame, join:joinGame, start:startGame, next:nextRound, submit, submitv:submitVotes, leave:newGame, copy:copyCode})[b.dataset.a]());
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vdraft[b.dataset.v] = +b.dataset.val; b.parentNode.querySelectorAll('.vb').forEach(x => x.classList.toggle('on', x === b)); });
  tick();
}
function home(k){
  return `<div class="card"><label>Tvoje ime</label><input id="name" maxlength="16" value="${esc(k.name ?? myName)}">
  <button data-a="create">Napravi igru</button></div>
  <div class="card"><b>Pridruži se igri</b><label>Kod igre</label><input id="jcode" class="code" maxlength="4" autocomplete="off">
  <button class="sec" data-a="join">Pridruži se</button></div>
  <div class="card"><details><summary>Pravila i bodovanje</summary><p class="small">Računar svaki put izvuče novo slovo (u 8 rundi se slova ne ponavljaju). Imaš 2 minuta da upišeš pojam na to slovo za svaku kategoriju. Odgovor koji ne počinje traženim slovom ne vredi.<br>• Različiti odgovori: 10 poena<br>• Isti odgovori: 5 poena<br>• Samo jedan igrač ima odgovor: 20 poena<br>• Ako svih 6 odgovora donese po 10 poena: bonus 10 poena<br>Posle svake runde svi glasaju za tuđe odgovore: zeleno ✓ (tačno) ili crveno ✗ (netačno). Odgovor se odbija (0 poena) ako je glasova „netačno“ više nego „tačno“; ko ne glasa, glasa „tačno“. Posle 8. runde pobeđuje igrač sa najviše poena.</p></details></div>`;
}
function roster(){ const t = game.status === 'lobby' ? {} : totals(game);
  return game.players.map(p => `<div class="pl"><span class="${p.id===pid?'me':''}">${esc(p.name)}${p.id===game.hostId?' <span class="small">(domaćin)</span>':''}</span><span>${t[p.id] !== undefined ? t[p.id] + ' p' : ''}</span></div>`).join(''); }
function lobby(){
  let h = `<div class="card"><label style="text-align:center">Kod igre – podeli ga ostalima</label><div class="big">${esc(game.code)}</div><button class="sec" data-a="copy">Kopiraj kod</button></div>
  <div class="card"><b>Igrači (${game.players.length}/4)</b>${roster()}</div>`;
  if (game.hostId === pid) h += `<button data-a="start" ${game.players.length < 2 ? 'disabled' : ''}>Počni igru</button><p class="small">Potreban je bar još jedan igrač.</p>`;
  else h += '<p class="small" style="text-align:center">Čekamo da domaćin pokrene igru…</p>';
  return h;
}
function playing(){
  const r = game.round, L = game.letters[r-1], mine = (game.answers['r'+r] || {})[pid], k = code + r;
  if (draftKey !== k) { draftKey = k; draft = ['','','','','','']; }
  const locked = !!mine || subKey === k, who = game.players.filter(p => (game.answers['r'+r] || {})[p.id]).length;
  let h = `<div class="card"><div class="row"><div><div class="small">Runda ${r}/${ROUNDS} · slovo</div><div class="letter">${esc(L)}</div></div><div class="timer" id="timer">2:00</div></div></div><div class="card">`;
  CATS.forEach((c,i) => { h += `<label>${c} na slovo ${esc(L)}</label><input data-i="${i}" autocomplete="off" autocapitalize="words" value="${esc(locked && mine ? (mine[i]||'') : draft[i])}" ${locked?'disabled':''}>`; });
  h += `<button data-a="submit" ${locked?'disabled':''}>${locked ? 'Predato – čekamo ostale (' + who + '/' + game.players.length + ')' : 'Predaj odgovore'}</button>
  <p class="small">Odgovori se automatski predaju kad vreme istekne.</p></div><div class="card"><b>Poeni</b>${roster()}</div>`;
  return h;
}
function voting(){
  const r = game.round, L = game.letters[r-1], Ln = norm(L), ans = game.answers['r'+r] || {}, vt = game.votes['r'+r] || {}, k = code + r;
  if (vkey !== k) { vkey = k; vdraft = {}; }
  const locked = !!vt[pid] || subVKey === k, done = game.players.filter(p => vt[p.id]).length;
  let h = `<div class="card"><div class="row"><div><div class="small">Glasanje · runda ${r}/${ROUNDS} · slovo ${esc(L)}</div><b>Da li su odgovori tačni?</b></div><div class="timer" id="vtimer">1:00</div></div></div>`;
  game.players.filter(p => p.id !== pid).forEach(p => {
    h += `<div class="card"><b>${esc(p.name)}</b>`;
    CATS.forEach((cn, c) => {
      const a = (ans[p.id]||[])[c] || '', n = norm(a), ok = n.length >= 2 && n[0] === Ln, key = p.id + '_' + c, my = (vt[pid]||{})[key];
      const cur = locked && my !== undefined ? my : (vdraft[key] === 0 ? 0 : 1);
      h += `<div class="pl vr"><div><span class="small">${cn}</span><br>${a ? '<b>' + esc(a) + '</b>' : '—'}${a && !ok ? ' <span class="small p0">(ne počinje na ' + esc(L) + ')</span>' : ''}</div>`;
      if (ok) h += `<div class="vbs"><button class="vb yes ${cur===1?'on':''}" data-v="${key}" data-val="1" ${locked?'disabled':''}>✓</button><button class="vb no ${cur===0?'on':''}" data-v="${key}" data-val="0" ${locked?'disabled':''}>✗</button></div>`;
      h += '</div>';
    });
    h += '</div>';
  });
  return h + `<p class="small">Zeleno ✓ = tačno, crveno ✗ = netačno. Odgovor se odbija ako je glasova „netačno“ više nego „tačno“. Ko ne glasa, glasa „tačno“.</p><button data-a="submitv" ${locked?'disabled':''}>${locked ? 'Potvrđeno – čekamo ostale (' + done + '/' + game.players.length + ')' : 'Potvrdi glasove'}</button>`;
}
function sheet(r){
  const sc = roundScore(game, r), L = game.letters[r-1];
  return game.players.map(p => { const o = sc[p.id];
    return `<div class="card"><div class="row"><b class="${p.id===pid?'me':''}">${esc(p.name)}</b><span class="small">slovo ${esc(L)}${o.bonus?' · bonus +10':''}</span></div><div class="wrap"><table><tr>${CATS.map(c=>`<th>${c}</th>`).join('')}<th>Zbir</th></tr><tr>${o.cells.map(x=>`<td class="p${x.pts>=20?20:x.pts}">${x.rej?'<span class="rej">'+esc(x.a)+'</span><br><span class="small">odbijeno</span>':(esc(x.a)||'—')}<b>${x.pts}</b></td>`).join('')}<td class="z">${o.sum}</td></tr></table></div></div>`; }).join('');
}
function review(){
  const r = game.round;
  return `<div class="card"><div class="small" style="text-align:center">Rezultati runde ${r}/${ROUNDS}</div></div>${sheet(r)}
  <div class="card"><b>Ukupno</b>${roster()}</div><button data-a="next">${r >= ROUNDS ? 'Prikaži pobednika' : 'Sledeća runda'}</button>`;
}
function done(){
  const t = totals(game), max = Math.max(...game.players.map(p => t[p.id])), w = game.players.filter(p => t[p.id] === max);
  let h = `<div class="card"><div class="win">${w.length > 1 ? '🤝 Nerešeno: ' : '🏆 Pobednik: '}${w.map(p => esc(p.name)).join(' i ')}</div><p class="small" style="text-align:center">${max} poena</p></div>
  <div class="card"><b>Konačan rezultat</b><div class="wrap"><table><tr><th>Igrač</th>${game.letters.map((l,i)=>`<th>${esc(l)}</th>`).join('')}<th>Ukupno</th></tr>`;
  const per = game.letters.map((l,i) => roundScore(game, i+1));
  game.players.forEach(p => { h += `<tr><td class="${p.id===pid?'me':''}">${esc(p.name)}</td>${per.map(s=>`<td>${s[p.id].sum}</td>`).join('')}<td class="z">${t[p.id]}</td></tr>`; });
  h += '</table></div></div>';
  game.letters.forEach((l,i) => { h += `<details class="card"><summary>Runda ${i+1} · slovo ${esc(l)}</summary>${sheet(i+1)}</details>`; });
  return h + '<button data-a="leave">Nova igra</button>';
}
boot();
</script>
</body>
</html>
