<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igraonica</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--ac:#2f6fed;--bd:#e2dfd7}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--card:#222428;--tx:#f0f0f2;--mut:#9a9aa2;--ac:#6b9bff;--bd:#33363c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:32px;margin:12px 0 4px}
p.sub{color:var(--mut);margin:0 0 22px}
a.game{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;text-decoration:none;color:inherit}
a.game:active{transform:scale(.99)}
.ico{font-size:40px;line-height:1}
.name{font-size:20px;font-weight:700}
.desc{font-size:14px;color:var(--mut);margin-top:2px}
.tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--ac);font-weight:600}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--ac);width:100%;cursor:pointer;margin-top:6px}
.small{font-size:13px;color:var(--mut);text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>🎲 Igraonica</h1>
<p class="sub">Izaberi igru, napravi sobu i pozovi prijatelje kodom.</p>
<div id="list"></div>
<button id="share">Podeli sa prijateljima</button>
<p class="small">Svaka igra radi na telefonu, u običnom pregledaču, bez naloga.</p>
</main>
<script>
/* Ovde dodaješ nove igre: ime, opis, adresa (datoteka) i ikona. */
const GAMES = [
  { icon: '🔐', name: 'Šifra', desc: 'Pogodi tajni četvorocifreni broj. Računar ili igrač zadaje šifru.', url: 'index2.html', tag: '2–4 igrača · logika' },
  { icon: '🌍', name: 'Zanimljiva geografija', desc: 'Država, grad, biljka, životinja, predmet, ime. 8 rundi, glasanje o odgovorima.', url: 'geografija.html', tag: '2–4 igrača · 8 rundi' },
  { icon: '🔤', name: 'Vešala', desc: 'Računar bira reč iz grupe, igrači naizmenično pogađaju slova. Ko sakupi 3 pobede, bira sledeću grupu.', url: 'vesala.html', tag: '2–4 igrača · reči' },
  { icon: '🧩', name: 'Asocijacije', desc: 'Otvaraj polja, pogađaj rešenja kolona A, B, C, D i konačno rešenje.', url: 'asocijacije.html', tag: '2–4 igrača · 3 asocijacije' }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML = GAMES.map(g =>
  `<a class="game" href="${esc(g.url)}"><div class="ico">${g.icon}</div><div><div class="name">${esc(g.name)}</div><div class="desc">${esc(g.desc)}</div><span class="tag">${esc(g.tag)}</span></div></a>`).join('');
document.getElementById('share').onclick = async () => {
  const data = { title: 'Igraonica', text: 'Dođi da se igramo!', url: location.href.split('#')[0] };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); alert('Link je kopiran.'); } } catch(e){}
};
</script>
</body>
</html>
