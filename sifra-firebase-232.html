<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šifra – igra logike</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--ac:#2f6fed;--acx:#fff;--ok:#1f9d55;--warn:#d98a00;--bd:#e2dfd7}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--card:#222428;--tx:#f0f0f2;--mut:#9a9aa2;--ac:#6b9bff;--acx:#10131a;--ok:#4cc783;--warn:#f0b43c;--bd:#33363c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}
p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.digits{font-size:28px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:0;background:var(--ac);color:var(--acx);width:100%;cursor:pointer;margin-top:10px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button:disabled{opacity:.45}
.err{color:#d6453d;min-height:1.3em;font-size:14px;margin-top:6px}
.code{font-size:40px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--ac)}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.pl:last-child{border:0}
.me{font-weight:700}
.turn{text-align:center;font-size:18px;font-weight:700}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);font-size:15px}
th{font-size:12px;color:var(--mut);font-weight:600}
td.g{font-weight:800;letter-spacing:.15em;font-size:17px}
.e{color:var(--ok);font-weight:800}.m{color:var(--warn);font-weight:800}
.win{text-align:center;font-size:20px;font-weight:800;color:var(--ok)}
.small{font-size:13px;color:var(--mut)}
.tag{font-size:12px;color:var(--mut)}
pre{white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<main id="app"><p class="sub">Učitavanje…</p></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ 1) OVDE nalepi svoju Firebase konfiguraciju ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDWpgn7qQjSrk9WaI0UhGQyaTv2SCCh5kc",
  authDomain: "sifra-62129.firebaseapp.com",
  databaseURL: "https://sifra-62129-default-rtdb.firebaseio.com",
  projectId: "sifra-62129",
  appId: "1:800751511664:web:e53e0eb6e392922a456cb5"
};
/* ===================================================================== */

const $app = document.getElementById('app');
const LS = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let pid = LS.get('sifra-pid');
if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); LS.set('sifra-pid', pid); }
let myName = LS.get('sifra-name'), code = null, game = null, ref = null, msg = '', busy = false, clearGuess = false;
let fdb = null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const valid = s => /^\d{4}$/.test(s) && new Set(s).size === 4;
const mkCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for (let i=0;i<4;i++) c += a[Math.floor(Math.random()*a.length)]; return c; };
const score = (s, g) => { let e=0, m=0; for (let i=0;i<4;i++){ if (g[i]===s[i]) e++; else if (s.includes(g[i])) m++; } return {e, m}; };
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const setMsg = t => { msg = t; const el = document.getElementById('err'); if (el) el.textContent = t; };
const secretKey = c => 'sifra-secret-' + c;
const guessers = g => (g.players || []).filter(p => p.id !== g.setterId);

function boot(){
  if (firebaseConfig.apiKey.startsWith('YOUR')) {
    $app.innerHTML = '<div class="card"><h1>Šifra</h1><p class="sub">Prvo upiši svoju Firebase konfiguraciju na vrhu skripte u ovoj HTML datoteci (blok „OVDE nalepi svoju Firebase konfiguraciju“).</p></div>';
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    fdb = firebase.database();
  } catch(e){ $app.innerHTML = '<div class="card"><p class="sub">Greška pri povezivanju sa Firebase-om.</p></div>'; return; }
  const saved = LS.get('sifra-code');
  if (saved) watch(saved); else render();
}

function watch(c){
  if (ref) ref.off();
  code = c; LS.set('sifra-code', c);
  ref = fdb.ref('games/' + c);
  ref.on('value', snap => {
    const v = snap.val();
    if (!v) { leave(); msg = 'Igra ' + c + ' ne postoji.'; render(); return; }
    v.players = v.players || []; v.guesses = v.guesses || []; v.wins = v.wins || {};
    game = v;
    setterProcess();
    render();
  }, () => { msg = 'Veza sa igrom je prekinuta.'; render(); });
}

function leave(){ if (ref) { ref.off(); ref = null; } code = null; game = null; LS.set('sifra-code', ''); }

/* Zadavalac šifre (njegov uređaj) automatski odgovara na pokušaje. Šifra se nikad ne šalje u bazu dok se igra ne završi. */
function setterProcess(){
  if (!game || game.setterId !== pid || game.status !== 'playing' || busy) return;
  const last = game.guesses[game.guesses.length - 1];
  if (!last || last.e !== undefined && last.e !== null) return;
  const secret = LS.get(secretKey(code));
  if (!valid(secret)) { msg = 'Šifra nije sačuvana u ovom pregledaču.'; return; }
  const r = score(secret, last.g), idx = game.guesses.length - 1;
  busy = true;
  ref.transaction(cur => {
    if (!cur || cur.status !== 'playing') return;
    const gs = cur.guesses || [];
    if (gs.length - 1 !== idx || (gs[idx].e !== undefined && gs[idx].e !== null)) return;
    gs[idx].e = r.e; gs[idx].m = r.m;
    cur.guesses = gs;
    const gl = (cur.players || []).filter(p => p.id !== cur.setterId);
    if (r.e === 4) {
      cur.status = 'done'; cur.winnerId = gs[idx].pid; cur.winnerName = gs[idx].name; cur.secret = secret;
      cur.wins = cur.wins || {}; cur.wins[gs[idx].pid] = (cur.wins[gs[idx].pid] || 0) + 1;
    } else {
      const i = gl.findIndex(p => p.id === cur.turnPid);
      cur.turnPid = gl[(i + 1) % gl.length].id;
    }
    return cur;
  }).then(() => { busy = false; }, () => { busy = false; });
}

async function createGame(){
  const name = val('name').trim(), sec = val('secret').trim();
  if (!name) return setMsg('Upiši svoje ime.');
  if (!valid(sec)) return setMsg('Šifra mora imati 4 različite cifre (0–9).');
  myName = name; LS.set('sifra-name', name);
  try {
    const c = mkCode();
    LS.set(secretKey(c), sec);
    await fdb.ref('games/' + c).set({ code: c, status: 'lobby', setterId: pid, players: [{ id: pid, name }], round: 1, created: Date.now() });
    msg = ''; watch(c);
  } catch(e){ setMsg('Nije moguće napraviti igru. Proveri Firebase podešavanja i pravila.'); }
}

async function joinGame(){
  const name = val('name').trim(), c = val('jcode').trim().toUpperCase();
  if (!name) return setMsg('Upiši svoje ime.');
  if (c.length !== 4) return setMsg('Kod igre ima 4 slova.');
  myName = name; LS.set('sifra-name', name);
  try {
    let err = '';
    const gref = fdb.ref('games/' + c);
    const first = await gref.once('value');
    if (!first.exists()) return setMsg('Igra sa tim kodom ne postoji.');
    const res = await gref.transaction(cur => {
      if (!cur) { err = 'Igra sa tim kodom ne postoji.'; return; }
      const pl = cur.players || [];
      if (pl.some(p => p.id === pid)) return;
      if (cur.status !== 'lobby') { err = 'Igra je već počela.'; return; }
      if (pl.length >= 4) { err = 'Igra je popunjena (najviše 4 igrača).'; return; }
      pl.push({ id: pid, name }); cur.players = pl; return cur;
    });
    if (err) return setMsg(err);
    msg = ''; watch(c);
  } catch(e){ setMsg('Pridruživanje nije uspelo.'); }
}

function startGame(){
  ref.transaction(cur => {
    if (!cur || cur.status !== 'lobby' || cur.setterId !== pid || (cur.players || []).length < 2) return;
    const gl = cur.players.filter(p => p.id !== cur.setterId);
    cur.status = 'playing'; cur.turnPid = gl[0].id; cur.guesses = []; cur.round = 1;
    return cur;
  });
}

function sendGuess(){
  const g = val('guess').trim();
  if (!valid(g)) return setMsg('Pokušaj mora imati 4 različite cifre.');
  clearGuess = true; msg = '';
  ref.transaction(cur => {
    if (!cur || cur.status !== 'playing' || cur.turnPid !== pid) return;
    const gs = cur.guesses || [];
    if (gs.length && (gs[gs.length-1].e === undefined || gs[gs.length-1].e === null)) return;
    gs.push({ pid, name: myName, g, e: null, m: null });
    cur.guesses = gs; return cur;
  });
}

/* Pobednik zadaje šifru za sledeću rundu */
function nextRound(){
  const sec = val('secret').trim();
  if (!valid(sec)) return setMsg('Šifra mora imati 4 različite cifre (0–9).');
  LS.set(secretKey(code), sec);
  ref.transaction(cur => {
    if (!cur || cur.status !== 'done' || cur.winnerId !== pid) return;
    cur.setterId = pid; cur.round = (cur.round || 1) + 1;
    const gl = cur.players.filter(p => p.id !== pid);
    cur.status = 'playing'; cur.turnPid = gl[0].id; cur.guesses = [];
    cur.winnerId = null; cur.winnerName = null; cur.secret = null;
    return cur;
  });
  msg = '';
}

function newGame(){ leave(); msg = ''; render(); }
function copyCode(){ try { navigator.clipboard.writeText(code); setMsg('Kod je kopiran.'); } catch(e){} }

function render(){
  const act = document.activeElement, aid = act && act.id, keep = {};
  ['name','secret','jcode','guess'].forEach(i => { const el = document.getElementById(i); if (el) keep[i] = el.value; });
  let h = '<h1>Šifra</h1><p class="sub">Igra logike za 2–4 igrača</p>';
  if (!game) h += home(keep);
  else if (game.status === 'lobby') h += lobby();
  else h += play();
  h += '<div class="err" id="err">' + esc(msg) + '</div>';
  $app.innerHTML = h;
  ['name','secret','jcode','guess'].forEach(i => { const el = document.getElementById(i); if (el && keep[i] !== undefined) el.value = keep[i]; });
  if (clearGuess) { const f = document.getElementById('guess'); if (f) f.value = ''; clearGuess = false; }
  const el = aid && document.getElementById(aid); if (el && el.focus) el.focus();
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => ({create:createGame, join:joinGame, start:startGame, guess:sendGuess, next:nextRound, fresh:newGame, copy:copyCode})[b.dataset.a]());
}

function home(k){
  return `<div class="card"><label>Tvoje ime</label><input id="name" maxlength="16" value="${esc(k.name ?? myName)}"></div>
  <div class="card"><b>Napravi igru</b><p class="small">Smisli šifru od 4 različite cifre i sakrij je. Ti zadaješ prvu šifru, ostali pogađaju.</p>
  <label>Tajna šifra (npr. 4261)</label><input id="secret" class="digits" inputmode="numeric" maxlength="4" autocomplete="off">
  <button data-a="create">Napravi igru</button></div>
  <div class="card"><b>Pridruži se igri</b><label style="margin-top:8px">Kod igre</label>
  <input id="jcode" class="digits" maxlength="4" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase">
  <button class="sec" data-a="join">Pridruži se</button></div>`;
}

function roster(){
  let h = '';
  game.players.forEach(p => {
    const role = p.id === game.setterId ? ' <span class="tag">(zadaje šifru)</span>' : '';
    const turn = game.status === 'playing' && game.turnPid === p.id ? ' ◀' : '';
    const w = game.wins[p.id] ? ` <span class="tag">🏆 ${game.wins[p.id]}</span>` : '';
    h += `<div class="pl"><span class="${p.id===pid?'me':''}">${esc(p.name)}${role}${turn}</span><span>${w}</span></div>`;
  });
  return h;
}

function lobby(){
  const isSetter = game.setterId === pid;
  let h = `<div class="card"><label style="text-align:center">Kod igre – podeli ga ostalima</label><div class="code">${esc(game.code)}</div>
  <button class="sec" data-a="copy">Kopiraj kod</button></div>
  <div class="card"><b>Igrači (${game.players.length}/4)</b>${roster()}</div>`;
  if (isSetter) h += `<button data-a="start" ${game.players.length < 2 ? 'disabled' : ''}>Počni igru</button>
    <p class="small">Potreban je bar još jedan igrač. Ostavi ovu stranicu otvorenom dok traje runda – tvoj uređaj automatski odgovara na pokušaje.</p>`;
  else h += '<p class="small" style="text-align:center">Čekamo da zadavalac pokrene igru…</p>';
  h += '<button class="sec" data-a="fresh">Napusti igru</button>';
  return h;
}

function play(){
  const gs = game.guesses, gl = guessers(game), n = gl.length || 1;
  const isSetter = game.setterId === pid;
  const pending = gs.length && (gs[gs.length-1].e === null || gs[gs.length-1].e === undefined);
  const cur = game.players.find(p => p.id === game.turnPid);
  const setter = game.players.find(p => p.id === game.setterId);
  let h = '';
  if (game.status === 'done') {
    h += `<div class="card"><div class="win">🎉 ${esc(game.winnerName)} je pogodio/la šifru!</div>
    <div class="code" style="letter-spacing:.3em">${esc(game.secret)}</div>
    <p class="small" style="text-align:center">Pokušaja u rundi: ${gs.length}</p>`;
    if (game.winnerId === pid) h += `<p style="text-align:center"><b>Ti zadaješ šifru za sledeću rundu!</b></p>
      <label>Nova tajna šifra (4 različite cifre)</label><input id="secret" class="digits" inputmode="numeric" maxlength="4" autocomplete="off">
      <button data-a="next">Počni sledeću rundu</button>`;
    else h += `<p class="small" style="text-align:center">Čekamo da ${esc(game.winnerName)} zada novu šifru…</p>`;
    h += `<button class="sec" data-a="fresh">Napusti igru</button></div>`;
  } else {
    const round = Math.floor(gs.length / n) + 1;
    h += `<div class="card"><div class="small" style="text-align:center">Runda ${game.round || 1} · krug ${round} · kod ${esc(game.code)}</div>`;
    if (isSetter) h += `<div class="turn">Na potezu: ${esc(cur ? cur.name : '')}</div><p class="small" style="text-align:center">Ti čuvaš šifru. Ne zatvaraj stranicu dok traje runda.</p>`;
    else if (game.turnPid === pid) {
      h += `<div class="turn">Tvoj red!</div><label style="margin-top:10px">Pokušaj (4 različite cifre)</label>
      <input id="guess" class="digits" inputmode="numeric" maxlength="4" autocomplete="off" ${pending?'disabled':''}>
      <button data-a="guess" ${pending?'disabled':''}>${pending?'Čekam odgovor…':'Pošalji pokušaj'}</button>`;
    } else h += `<div class="turn">Na potezu: ${esc(cur ? cur.name : '')}</div><p class="small" style="text-align:center">Šifru zadaje ${esc(setter ? setter.name : '')}.</p>`;
    h += '</div>';
  }
  h += `<div class="card"><b>Pokušaji</b><div class="wrap"><table><tr><th>Krug</th><th>Igrač</th><th>Broj</th><th>Tačno mesto</th><th>Pogrešno mesto</th></tr>`;
  if (!gs.length) h += '<tr><td colspan="5" class="small">Još nema pokušaja.</td></tr>';
  gs.map((x,i) => ({x,i})).reverse().forEach(({x,i}) => {
    const done = x.e !== null && x.e !== undefined;
    h += `<tr><td>${Math.floor(i/n)+1}</td><td>${esc(x.name)}</td><td class="g">${esc(x.g)}</td>` +
      (done ? `<td class="e">${x.e}</td><td class="m">${x.m}</td>` : '<td colspan="2" class="small">…</td>') + '</tr>';
  });
  h += `</table></div></div><div class="card"><b>Igrači</b>${roster()}</div>`;
  if (game.status !== 'done') h += '<button class="sec" data-a="fresh">Napusti igru</button>';
  return h;
}

boot();
</script>
</body>
</html>
